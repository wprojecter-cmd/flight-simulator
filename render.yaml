services:
  - type: web
    name: flight-simulator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: flight_simulator
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENWEATHER_API_KEY
        sync: false
